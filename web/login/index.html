<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Staff Login | SKPass</title>
    <meta name="description" content="SKPass sign in for authorized guards and administrators." />
    <meta name="theme-color" content="#10141a" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" type="image/png" href="../icons/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="../css/portal.css" />
    <link rel="stylesheet" href="../css/form-controls.css" />
    <link rel="stylesheet" href="../css/login.css" />
    <link rel="stylesheet" href="../css/control-shapes.css" />
  </head>
  <body class="login-page">
    <canvas class="portal-pattern" aria-hidden="true"></canvas>
    <script type="module" src="../js/background.js?v=convex-2"></script>
    <skpass-header></skpass-header>
    <script type="module" src="../js/header.js"></script>
    <main>
      <div class="auth-container">
        <div class="auth-intro">
          <img src="../icons/logo.png" width="88" height="88" alt="SKPass vehicle gate pass" />
          <h1>Staff Login</h1>
          <p>Guards and administrators</p>
        </div>
        <section class="auth-card" aria-labelledby="auth-title">
          <div
            class="auth-card-heading"><span class="status-dot" aria-hidden="true"></span><h2 id="auth-title">Authentication portal</h2></div>
          <div id="alert" class="alert error" role="alert" hidden></div>
          <form id="login-form" novalidate>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="username"
                placeholder="Enter your email" required />
            </div>
            <div class="field">
              <div
                class="label-row"><label for="password">Password</label><a id="forgot" href="#forgot">Forgot password?</a></div>
              <input id="password" name="password" type="password" autocomplete="current-password"
                placeholder="Enter your password" required />
            </div>
            <button id="submit"
              type="submit">Sign in <span aria-hidden="true">&rarr;</span></button>
          </form>
          <p
            class="access-notice">Restricted to authorized enforcement officers, marshals, and perimeter administrators. All operations are logged.</p>
        </section>
        <a class="back-link" href="../"><span aria-hidden="true">&larr;</span> Back to home</a>
      </div>
    </main>
    <skpass-footer></skpass-footer>
    <script type="module" src="../js/footer.js"></script>
    <script src="../js/vendor/supabase.js"></script>
    <script type="module" src="../js/login.js"></script>
    <script type="module" src="../js/form-controls.js"></script>
    <script type="module" src="../js/pwa.js"></script>
  </body>
</html>
