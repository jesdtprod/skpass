<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Staff Login · SKPass</title>
    <meta name="theme-color" content="#2d9a0f" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" type="image/png" href="../icons/favicon-32.png?v=fullcolor-2" sizes="32x32" />
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png?v=fullcolor-2" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/form-controls.css?v=1" />
    <link rel="stylesheet" href="../css/control-shapes.css" />
  </head>
  <body>
    <skpass-header></skpass-header>
    <script type="module" src="../js/header.js"></script>
    <main class="container">
      <header class="brand compact">
        <a href="../"><img src="../icons/logo.png" alt="SKPass" /></a>
        <h1>Staff Login</h1>
        <p>Guards and administrators</p>
      </header>

      <div id="alert" class="alert error" role="alert" hidden></div>

      <form id="login-form" class="card" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password"
            required />
        </div>
        <button id="submit" class="btn" type="submit">Sign in</button>
      </form>
      <p class="center"><a href="../">Back to home</a></p>
    </main>
    <script src="../js/vendor/supabase.js"></script>
    <script type="module" src="../js/login.js"></script>
    <script type="module" src="../js/pwa.js"></script>
    <skpass-footer></skpass-footer>
    <script type="module" src="../js/footer.js"></script>
    <script type="module" src="../js/form-controls.js"></script>
  </body>
</html>
