<!DOCTYPE html>
<html class="h-full bg-[#10141a] text-slate-100 antialiased dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>SKPass Admin - Approvals Queue | Provincial Government</title>
    <meta name="description"
      content="SKPass Provincial Government Vehicle Gate Access Administration Console." />
    <meta name="theme-color" content="#10141a" />
    <meta name="robots" content="noindex" />

    <!-- PWA & Favicons -->
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" href="../icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />

    <!-- Tailwind CSS CDN with forms and container queries -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ["Plus Jakarta Sans", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"],
          },
          colors: {
            brand: {
              50: "#f3ffe5",
              100: "#e5ffc2",
              400: "#a3e635",
              500: "#91df16",
              600: "#70ba0b",
              700: "#438509",
              accent: "#a3e635",
            },
            surface: {
              base: "#10141a",
              card: "#1c2026",
              cardLighter: "#252c31",
              border: "#30383e",
              borderLight: "#424b52",
            },
          },
        },
      },
    };
    </script>

    <!-- Base and Admin Stylesheets -->
    <link rel="stylesheet" href="../css/admin.css" />

    <!-- Stylesheet for custom glow accents and scrollbars -->
    <style data-purpose="custom-decorations">
    .glow-emerald {
      box-shadow: 0 0 20px -3px rgba(145, 223, 22, 0.25);
    }
    .glow-lime-sm {
      box-shadow: 0 0 10px -2px rgba(145, 223, 22, 0.35);
    }
    .plate-badge {
      font-family: "JetBrains Mono", monospace;
      letter-spacing: 0.08em;
    }
    /* Custom sleek scrollbar for queues */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #10141a;
    }
    ::-webkit-scrollbar-thumb {
      background: #30383e;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #424b52;
    }

    /* Mobile Navigation drawer */
    @media (max-width: 820px) {
      aside.side {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 50;
        transform: translateX(-100%);
        transition: transform 0.25s ease-in-out;
      }
      body.nav-open aside.side {
        transform: translateX(0);
        box-shadow: 0 0 0 100vmax rgba(0, 0, 0, 0.7);
      }
    }
    </style>
    <link rel="stylesheet" href="../css/portal.css" />
    <link rel="stylesheet" href="../css/control-shapes.css" />
    <link rel="stylesheet" href="../css/admin-home.css" />
  </head>
  <body
    class="admin admin-home h-full flex flex-col font-sans overflow-x-hidden selection:bg-brand-500 selection:text-white">
    <!-- BEGIN: TopBar -->
    <skpass-header admin></skpass-header>
    <script type="module" src="../js/header.js"></script>
    <div
      class="admin-mobile-toolbar"><button id="menu" type="button" aria-label="Toggle navigation" aria-expanded="false">&#9776;</button><span>SKPass Admin</span><a href="../scan/">Open Scanner &rarr;</a></div>
    <!-- END: TopBar -->

    <div class="admin-workspace">
      <!-- BEGIN: Sidebar -->
      <aside
        class="side w-64 bg-[#11171c] border-r border-surface-border flex flex-col justify-between shrink-0 select-none">
        <div>
          <!-- App Title / Brand Section -->
          <div class="p-4 border-b border-surface-border/80 flex items-center space-x-3">
            <img alt="SKPass Security" class="h-10 w-10 drop-shadow-md rounded-xl"
              src="../icons/logo.png" />
            <div>
              <div class="flex items-center space-x-1.5">
                <span
                  class="text-base font-extrabold tracking-tight text-white font-mono">SKPass</span>
                <span
                  class="text-[10px] font-bold uppercase tracking-wider text-brand-400 bg-brand-950/70 border border-brand-500/30 px-1.5 py-0.2 rounded"
                >ADMIN</span>
              </div>
              <p class="text-[11px] text-slate-400">Gate Access Authority</p>
            </div>
          </div>

          <!-- Navigation Menu (Dynamically populated by app.js) -->
          <nav id="nav" aria-label="Sidebar Navigation" class="p-3 space-y-1"></nav>
        </div>

        <!-- User Profile & System Status Footer -->
        <div class="p-3 border-t border-surface-border bg-surface-card/40">
          <div
            class="flex items-center space-x-3 p-2 rounded-lg hover:bg-surface-card transition-colors">
            <div class="relative">
              <div
                id="avatar-initials"
                class="w-8 h-8 rounded-full bg-gradient-to-tr from-brand-600 to-lime-400 flex items-center justify-center font-bold text-xs text-slate-950 font-mono shadow-sm"
              >
                AD
              </div>
              <span
                class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-brand-500 rounded-full border-2 border-[#11171c]"></span>
            </div>
            <div class="overflow-hidden flex-1">
              <p id="who" class="text-xs font-semibold text-slate-200 truncate">Administrator</p>
              <p class="text-[10px] text-slate-400 font-mono">Terminal #01 • Online</p>
            </div>
            <button id="signout"
              class="text-slate-500 hover:text-slate-300 cursor-pointer p-1 rounded"
              title="Sign out" type="button">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                ></path>
              </svg>
            </button>
          </div>
          <div
            class="mt-2 text-[10px] text-slate-500 font-mono px-2 flex justify-between items-center">
            <span>v2.8.4-RELEASE</span>
            <span class="text-brand-500 font-medium">SSL Encrypted</span>
          </div>
        </div>
      </aside>
      <!-- END: Sidebar -->

      <!-- BEGIN: MainContent Area -->
      <main
        id="content"
        class="content flex-1 overflow-y-auto bg-gradient-to-b from-[#10141a] via-[#0c1220] to-[#10141a] p-6 lg:p-8"
        tabindex="-1"
      ></main>
      <!-- END: MainContent Area -->
    </div>

    <!-- BEGIN: BottomTelemetryBar -->
    <!-- END: BottomTelemetryBar -->

    <!-- Global Toast Container -->
    <div id="toasts" class="toasts" aria-live="polite"></div>

    <!-- Admin Scripts -->
    <script src="../js/vendor/supabase.js"></script>
    <script src="../js/vendor/qrcode.js"></script>
    <script type="module" src="../js/admin/app.js"></script>
    <script type="module" src="../js/password-toggle.js"></script>
    <script type="module" src="../js/pwa.js"></script>
  </body>
</html>
